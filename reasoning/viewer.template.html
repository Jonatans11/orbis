<title>Orbis Reasoning Map</title>
<style>
  :root {
    --bg: #070b14;
    --bg-elev: rgba(13, 19, 34, 0.92);
    --bg-chip: rgba(21, 29, 48, 0.85);
    --ink: #e9edf5;
    --muted: #8b95aa;
    --line: rgba(139, 149, 170, 0.22);
    --accent: #5cc8e8;
    --law: #e3b655;
    --decision: #5cc8e8;
    --rule: #6fd598;
    --constraint: #e8756b;
    --direction: #a78be8;
    --principle: #f2efe6;
    --sans: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); overflow: hidden;
  }
  #space { position: fixed; inset: 0; cursor: grab; touch-action: none; }
  #space.dragging { cursor: grabbing; }

  .hud { position: fixed; z-index: 2; }

  #masthead { top: 20px; left: 24px; pointer-events: none; max-width: 340px; }
  #masthead h1 {
    margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  #masthead h1 span { color: var(--accent); }
  #masthead p {
    margin: 6px 0 0; font-size: 12px; line-height: 1.5; color: var(--muted);
  }
  #counts { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 8px; }

  #legend {
    bottom: 20px; left: 24px; display: flex; flex-direction: column; gap: 6px;
  }
  #legend .hint { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .chip {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-chip); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 12px 5px 8px;
    font-size: 12px; cursor: pointer; user-select: none;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .chip:hover { border-color: var(--muted); }
  .chip.off { opacity: 0.35; }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .chip .n { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-left: auto; padding-left: 10px; }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #searchbox { top: 20px; right: 24px; width: min(280px, calc(100vw - 48px)); }
  #search {
    width: 100%; box-sizing: border-box;
    background: var(--bg-elev); border: 1px solid var(--line); border-radius: 8px;
    color: var(--ink); font-family: var(--mono); font-size: 12px; padding: 9px 12px;
  }
  #search::placeholder { color: var(--muted); }
  #search:focus { outline: none; border-color: var(--accent); }
  #results {
    margin-top: 6px; background: var(--bg-elev); border: 1px solid var(--line);
    border-radius: 8px; max-height: 260px; overflow-y: auto; display: none;
  }
  #results button {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    color: var(--ink); font-family: var(--sans); font-size: 12px;
    padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--line);
  }
  #results button:last-child { border-bottom: 0; }
  #results button:hover, #results button:focus-visible { background: rgba(92, 200, 232, 0.12); outline: none; }
  #results .rid { font-family: var(--mono); font-size: 10px; color: var(--muted); display: block; }

  #panel {
    top: 0; right: 0; height: 100%; width: min(400px, 100vw);
    background: var(--bg-elev); border-left: 1px solid var(--line);
    backdrop-filter: blur(10px); box-sizing: border-box;
    padding: 24px; overflow-y: auto;
    transform: translateX(105%); transition: transform 0.25s ease;
    z-index: 3;
  }
  @media (prefers-reduced-motion: reduce) {
    #panel { transition: none; }
  }
  #panel.open { transform: translateX(0); }
  #panel .type-tag {
    display: inline-block; font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 4px; color: var(--bg);
  }
  #panel h2 { margin: 10px 0 4px; font-size: 18px; line-height: 1.3; text-wrap: balance; }
  #panel .nid { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  #panel .stmt { font-size: 13px; line-height: 1.65; margin: 14px 0; }
  #panel .src {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    background: rgba(0,0,0,0.25); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px; word-break: break-all;
  }
  #panel h3 {
    margin: 20px 0 8px; font-size: 10px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted); font-weight: 600;
  }
  .edge-row {
    display: flex; align-items: baseline; gap: 8px; width: 100%;
    background: none; border: 0; border-left: 2px solid var(--line);
    color: var(--ink); text-align: left; font-size: 12px;
    padding: 6px 0 6px 10px; margin: 2px 0; cursor: pointer;
  }
  .edge-row:hover, .edge-row:focus-visible { border-left-color: var(--accent); background: rgba(92,200,232,0.07); outline: none; }
  .edge-row .rel { font-family: var(--mono); font-size: 10px; color: var(--muted); flex: none; }
  #close-panel {
    position: absolute; top: 14px; right: 14px; background: none; border: 1px solid var(--line);
    border-radius: 6px; color: var(--muted); font-size: 13px; width: 28px; height: 28px;
    cursor: pointer;
  }
  #close-panel:hover { color: var(--ink); border-color: var(--muted); }

  #tooltip {
    position: fixed; z-index: 4; pointer-events: none; display: none;
    background: var(--bg-elev); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; font-size: 12px; max-width: 260px;
  }
  #tooltip .tid { font-family: var(--mono); font-size: 10px; color: var(--muted); }

  #help {
    bottom: 20px; right: 24px; font-size: 11px; color: var(--muted);
    text-align: right; pointer-events: none;
  }
  @media (max-width: 720px) {
    #masthead p, #help { display: none; }
  }
</style>

<canvas id="space"></canvas>

<div class="hud" id="masthead">
  <h1>Orbis <span>Reasoning Map</span></h1>
  <p>Every law, decision, rule, constraint, direction, and principle of the
     ORBIS.ID platform — principles at the core, external standards as the
     outer shell.</p>
  <div id="counts"></div>
</div>

<div class="hud" id="legend" role="group" aria-label="Filter by node type">
  <div class="hint">click to filter</div>
</div>

<div class="hud" id="searchbox">
  <input id="search" type="search" placeholder="search nodes…" aria-label="Search nodes" />
  <div id="results" role="listbox"></div>
</div>

<div class="hud" id="help">drag to orbit · scroll to zoom · click a node</div>

<aside class="hud" id="panel" aria-live="polite">
  <button id="close-panel" aria-label="Close details">×</button>
  <div id="panel-body"></div>
</aside>

<div id="tooltip"></div>

<script>
"use strict";
const DATA = /*__REASONING_MAP_DATA__*/null;

const TYPE_COLOR = {
  law: "#e3b655", decision: "#5cc8e8", rule: "#6fd598",
  constraint: "#e8756b", direction: "#a78be8", principle: "#f2efe6",
};
const TYPE_ORDER = ["principle", "decision", "rule", "constraint", "law", "direction"];

const nodes = DATA.nodes;
const byId = new Map(nodes.map(n => [n.id, n]));
const edges = DATA.edges.filter(e => byId.has(e.source) && byId.has(e.target));
const neighbors = new Map(nodes.map(n => [n.id, []]));
for (const e of edges) {
  neighbors.get(e.source).push({ other: e.target, rel: e.relation, dir: "→" });
  neighbors.get(e.target).push({ other: e.source, rel: e.relation, dir: "←" });
}

// ---- state ----
const typeOn = Object.fromEntries(TYPE_ORDER.map(t => [t, true]));
let yaw = 0.6, pitch = 0.35, dist = 720, autoSpin = !matchMedia("(prefers-reduced-motion: reduce)").matches;
let selected = null, hovered = null;
let targetYaw = null, targetPitch = null; // eased focus animation

// ---- canvas ----
const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
}
window.addEventListener("resize", resize); resize();

// starfield backdrop (deterministic)
const stars = [];
(function () {
  let s = 42;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 130; i++) stars.push({ x: rnd(), y: rnd(), r: rnd() * 1.1 + 0.2, a: rnd() * 0.5 + 0.1 });
})();

function project(p) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  let x = p[0] * cy + p[2] * sy;
  let z = -p[0] * sy + p[2] * cy;
  let y = p[1] * cp - z * sp;
  z = p[1] * sp + z * cp;
  const scale = dist / (dist + z);
  return { x: W / 2 + x * scale, y: H / 2 + y * scale, z, scale };
}

const projected = new Map();
function visible(n) { return typeOn[n.type]; }

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  for (const st of stars) {
    ctx.globalAlpha = st.a;
    ctx.fillStyle = "#c9d4ea";
    ctx.beginPath(); ctx.arc(st.x * W, st.y * H, st.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  projected.clear();
  for (const n of nodes) projected.set(n.id, project(n.pos));

  const focusSet = selected ? new Set([selected, ...neighbors.get(selected).map(e => e.other)]) : null;

  // edges
  for (const e of edges) {
    const a = byId.get(e.source), b = byId.get(e.target);
    if (!visible(a) || !visible(b)) continue;
    const pa = projected.get(a.id), pb = projected.get(b.id);
    const onFocus = focusSet && (e.source === selected || e.target === selected);
    if (focusSet && !onFocus) ctx.globalAlpha = 0.04;
    else ctx.globalAlpha = onFocus ? 0.55 : 0.13;
    ctx.strokeStyle = onFocus ? "#5cc8e8" : "#8b95aa";
    ctx.lineWidth = onFocus ? 1.2 : 0.6;
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // nodes, back to front
  const order = [...nodes].filter(visible).sort((a, b) => projected.get(b.id).z - projected.get(a.id).z);
  for (const n of order) {
    const p = projected.get(n.id);
    const base = n.type === "principle" ? 6.5 : 4.5;
    const r = Math.max(1.5, base * p.scale);
    const dim = focusSet && !focusSet.has(n.id);
    const depth = Math.max(0.25, Math.min(1, p.scale * p.scale));
    ctx.globalAlpha = dim ? 0.15 : depth;
    ctx.fillStyle = TYPE_COLOR[n.type];
    if (n.id === selected || n.id === hovered) {
      ctx.shadowColor = TYPE_COLOR[n.type]; ctx.shadowBlur = 18;
    }
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;
    if (n.id === selected) {
      ctx.strokeStyle = "#e9edf5"; ctx.lineWidth = 1.4; ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 4, 0, 7); ctx.stroke();
    }
    // labels: selected, hovered, neighbors of selected, or principles
    if (!dim && (n.id === selected || n.id === hovered || (focusSet && focusSet.has(n.id)) || (n.type === "principle" && !focusSet && dist < 480))) {
      ctx.globalAlpha = n.id === selected || n.id === hovered ? 1 : 0.75;
      ctx.font = "10px " + "ui-monospace, Menlo, monospace";
      ctx.fillStyle = "#e9edf5";
      ctx.fillText(n.title.length > 38 ? n.title.slice(0, 37) + "…" : n.title, p.x + r + 5, p.y + 3);
    }
  }
  ctx.globalAlpha = 1;
}

function tick() {
  if (targetYaw !== null) {
    yaw += (targetYaw - yaw) * 0.12; pitch += (targetPitch - pitch) * 0.12;
    if (Math.abs(targetYaw - yaw) < 0.002 && Math.abs(targetPitch - pitch) < 0.002) { targetYaw = targetPitch = null; }
  } else if (autoSpin && !dragging && !selected) {
    yaw += 0.0016;
  }
  draw();
  requestAnimationFrame(tick);
}

// ---- interaction ----
let dragging = false, moved = false, lastX = 0, lastY = 0, pinchD = 0;
canvas.addEventListener("pointerdown", ev => {
  dragging = true; moved = false; lastX = ev.clientX; lastY = ev.clientY;
  canvas.classList.add("dragging"); canvas.setPointerCapture(ev.pointerId);
});
canvas.addEventListener("pointermove", ev => {
  if (dragging) {
    const dx = ev.clientX - lastX, dy = ev.clientY - lastY;
    if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
    yaw += dx * 0.005; pitch = Math.max(-1.4, Math.min(1.4, pitch + dy * 0.005));
    targetYaw = targetPitch = null;
    lastX = ev.clientX; lastY = ev.clientY;
  } else {
    hovered = pick(ev.clientX, ev.clientY);
    const tip = document.getElementById("tooltip");
    if (hovered) {
      const n = byId.get(hovered);
      tip.style.display = "block";
      tip.innerHTML = `<span class="tid">${esc(n.type)} · ${esc(n.id)}</span><br>${esc(n.title)}`;
      tip.style.left = Math.min(ev.clientX + 14, W - 280) + "px";
      tip.style.top = (ev.clientY + 14) + "px";
      canvas.style.cursor = "pointer";
    } else {
      tip.style.display = "none";
      canvas.style.cursor = dragging ? "grabbing" : "grab";
    }
  }
});
canvas.addEventListener("pointerup", ev => {
  dragging = false; canvas.classList.remove("dragging");
  if (!moved) {
    const hit = pick(ev.clientX, ev.clientY);
    if (hit) select(hit); else deselect();
  }
});
canvas.addEventListener("wheel", ev => {
  ev.preventDefault();
  dist = Math.max(260, Math.min(2200, dist + ev.deltaY * 0.8));
}, { passive: false });

canvas.addEventListener("touchstart", ev => {
  if (ev.touches.length === 2) pinchD = Math.hypot(
    ev.touches[0].clientX - ev.touches[1].clientX, ev.touches[0].clientY - ev.touches[1].clientY);
});
canvas.addEventListener("touchmove", ev => {
  if (ev.touches.length === 2) {
    const d = Math.hypot(ev.touches[0].clientX - ev.touches[1].clientX, ev.touches[0].clientY - ev.touches[1].clientY);
    dist = Math.max(260, Math.min(2200, dist - (d - pinchD) * 2));
    pinchD = d;
  }
});

function pick(cx, cy) {
  let best = null, bestD = 14;
  for (const n of nodes) {
    if (!visible(n)) continue;
    const p = projected.get(n.id);
    if (!p) continue;
    const d = Math.hypot(p.x - cx, p.y - cy);
    if (d < bestD) { bestD = d; best = n.id; }
  }
  return best;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ---- selection & panel ----
function select(id) {
  selected = id;
  const n = byId.get(id);
  // rotate the camera so the node faces front
  const [x, , z] = n.pos;
  if (x || z) targetYaw = Math.atan2(-x, z) + Math.PI, targetPitch = pitch;
  const rel = neighbors.get(id);
  const body = document.getElementById("panel-body");
  body.innerHTML = `
    <span class="type-tag" style="background:${TYPE_COLOR[n.type]}">${esc(n.type)}</span>
    <h2>${esc(n.title)}</h2>
    <div class="nid">${esc(n.id)} · ${esc(n.domain || "")}</div>
    <p class="stmt">${esc(n.statement)}</p>
    <div class="src">${esc(n.source || "—")}</div>
    ${rel.length ? "<h3>Connections</h3>" : ""}
    ${rel.map(e => {
      const o = byId.get(e.other);
      return `<button class="edge-row" data-go="${esc(e.other)}">
        <span class="rel">${esc(e.dir)} ${esc(e.rel)}</span>
        <span style="color:${TYPE_COLOR[o.type]}">●</span> ${esc(o.title)}</button>`;
    }).join("")}`;
  body.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => select(b.dataset.go)));
  document.getElementById("panel").classList.add("open");
}
function deselect() {
  selected = null;
  document.getElementById("panel").classList.remove("open");
}
document.getElementById("close-panel").addEventListener("click", deselect);
window.addEventListener("keydown", ev => { if (ev.key === "Escape") deselect(); });

// ---- legend / filters ----
const legend = document.getElementById("legend");
for (const t of TYPE_ORDER) {
  const count = nodes.filter(n => n.type === t).length;
  const chip = document.createElement("button");
  chip.className = "chip"; chip.setAttribute("aria-pressed", "true");
  chip.innerHTML = `<span class="dot" style="background:${TYPE_COLOR[t]}"></span>${t}s<span class="n">${count}</span>`;
  chip.addEventListener("click", () => {
    typeOn[t] = !typeOn[t];
    chip.classList.toggle("off", !typeOn[t]);
    chip.setAttribute("aria-pressed", String(typeOn[t]));
    if (selected && !typeOn[byId.get(selected).type]) deselect();
  });
  legend.appendChild(chip);
}
document.getElementById("counts").textContent =
  `${nodes.length} nodes · ${edges.length} edges · ${DATA.meta && DATA.meta.generated ? "as of " + DATA.meta.generated : ""}`;

// ---- search ----
const searchEl = document.getElementById("search");
const resultsEl = document.getElementById("results");
searchEl.addEventListener("input", () => {
  const q = searchEl.value.trim().toLowerCase();
  if (!q) { resultsEl.style.display = "none"; resultsEl.innerHTML = ""; return; }
  const hits = nodes.filter(n =>
    n.id.includes(q) || n.title.toLowerCase().includes(q) ||
    n.statement.toLowerCase().includes(q) || (n.domain || "").includes(q)
  ).slice(0, 12);
  resultsEl.innerHTML = hits.map(n =>
    `<button data-go="${esc(n.id)}"><span style="color:${TYPE_COLOR[n.type]}">●</span> ${esc(n.title)}<span class="rid">${esc(n.id)}</span></button>`
  ).join("") || `<button disabled>no matches</button>`;
  resultsEl.style.display = "block";
  resultsEl.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => {
    select(b.dataset.go); resultsEl.style.display = "none"; searchEl.value = "";
  }));
});
searchEl.addEventListener("keydown", ev => {
  if (ev.key === "Enter") {
    const first = resultsEl.querySelector("[data-go]");
    if (first) { select(first.dataset.go); resultsEl.style.display = "none"; searchEl.value = ""; }
  }
});

tick();
</script>
