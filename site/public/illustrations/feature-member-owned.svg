<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Member-owned illustration">
  <defs>
    <linearGradient id="mOrbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect width="320" height="200" rx="16" fill="#0F172A" stroke="#1E293B"/>

  <!-- Old way: a vault with the company -->
  <g transform="translate(80 100)">
    <rect x="-36" y="-30" width="72" height="60" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="0" y="-12" text-anchor="middle" fill="#EF4444" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="0.06em">CENTRALIZED</text>
    <g transform="translate(-8 -2)" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="16" height="14" rx="2"/>
      <path d="M4 0v-3a4 4 0 0 1 8 0v3"/>
    </g>
    <text x="0" y="24" text-anchor="middle" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="9">data honeypot</text>
  </g>

  <!-- Arrow / vs -->
  <g transform="translate(160 100)">
    <text x="0" y="4" text-anchor="middle" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">VS</text>
  </g>

  <!-- New way: identity on device, member-owned -->
  <g transform="translate(240 100)">
    <rect x="-36" y="-30" width="72" height="60" rx="8" fill="#1E293B" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="0" y="-12" text-anchor="middle" fill="#22D3EE" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="0.06em">MEMBER</text>
    <g transform="translate(0 4)">
      <circle r="10" fill="url(#mOrbit)"/>
      <path d="M-4 0 L-1 3 L5 -3" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="0" y="24" text-anchor="middle" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="9">keys on your device</text>
  </g>
</svg>
