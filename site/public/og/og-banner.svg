<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="ORBIS.ID — your identity, your orbit">
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
    <radialGradient id="ogHalo" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#22D3EE" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ogOrbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="55%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="ogText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <pattern id="ogDots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#4F46E5" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#ogDots)"/>
  <rect width="1200" height="630" fill="url(#ogHalo)"/>

  <!-- Orbit decorations right side -->
  <g transform="translate(900 315)" fill="none" stroke="url(#ogOrbit)">
    <circle r="280" stroke-width="1" stroke-opacity="0.15"/>
    <circle r="220" stroke-width="1" stroke-opacity="0.22"/>
    <circle r="160" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="2 6"/>
    <circle r="100" stroke-width="2.5" stroke-opacity="0.65"/>
    <circle r="40" stroke-width="3" fill="url(#ogOrbit)" stroke="none"/>
    <path d="M-12 0 L-4 8 L12 -8" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Satellite dots -->
  <g fill="#22D3EE">
    <circle cx="1180" cy="315" r="5"/>
    <circle cx="20" cy="40" r="3"/>
    <circle cx="60" cy="600" r="3"/>
  </g>
  <g fill="#6366F1">
    <circle cx="900" cy="35" r="3"/>
    <circle cx="900" cy="595" r="3"/>
    <circle cx="640" cy="80" r="2"/>
  </g>

  <!-- Wordmark + headline -->
  <g font-family="Inter, system-ui, -apple-system, sans-serif">
    <!-- Logo mark + wordmark -->
    <g transform="translate(80 110)">
      <g transform="translate(0 0)">
        <circle cx="32" cy="32" r="30" fill="none" stroke="url(#ogOrbit)" stroke-width="2" stroke-opacity="0.55"/>
        <circle cx="32" cy="32" r="22" fill="none" stroke="url(#ogOrbit)" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="2 3.5"/>
        <circle cx="32" cy="32" r="14" fill="none" stroke="url(#ogOrbit)" stroke-width="2"/>
        <circle cx="32" cy="32" r="7" fill="url(#ogOrbit)"/>
        <path d="M27 32 L31 36 L37 28" fill="none" stroke="#0B1020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="80" y="42" fill="#F8FAFC" font-size="32" font-weight="700" letter-spacing="-0.02em">ORBIS<tspan fill="url(#ogText)">.ID</tspan></text>
    </g>

    <!-- Headline -->
    <text x="80" y="320" fill="#F8FAFC" font-size="78" font-weight="800" letter-spacing="-0.03em">Your identity.</text>
    <text x="80" y="400" fill="#F8FAFC" font-size="78" font-weight="800" letter-spacing="-0.03em">Yours alone.</text>

    <!-- Subhead -->
    <text x="80" y="470" fill="#94A3B8" font-size="24" font-weight="400">Member-owned self-sovereign identity.</text>
    <text x="80" y="504" fill="#94A3B8" font-size="24" font-weight="400">Prove anything about yourself — without showing everything.</text>

    <!-- Tag chips -->
    <g transform="translate(80 540)">
      <g>
        <rect width="160" height="36" rx="9999" fill="#1E293B" stroke="#334155"/>
        <text x="80" y="23" text-anchor="middle" fill="#22D3EE" font-size="13" font-weight="600">Zero-knowledge proofs</text>
      </g>
      <g transform="translate(176 0)">
        <rect width="140" height="36" rx="9999" fill="#1E293B" stroke="#334155"/>
        <text x="70" y="23" text-anchor="middle" fill="#818CF8" font-size="13" font-weight="600">W3C compliant</text>
      </g>
      <g transform="translate(332 0)">
        <rect width="160" height="36" rx="9999" fill="#1E293B" stroke="#334155"/>
        <text x="80" y="23" text-anchor="middle" fill="#34D399" font-size="13" font-weight="600">No data honeypot</text>
      </g>
    </g>
  </g>
</svg>
