<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" role="img" aria-label="ORBIS.ID — Twitter/X header">
  <defs>
    <linearGradient id="twBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="twHalo" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="twOrbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="500" fill="url(#twBg)"/>
  <rect width="1500" height="500" fill="url(#twHalo)"/>

  <!-- Big orbit right -->
  <g transform="translate(1200 250)" fill="none" stroke="url(#twOrbit)">
    <circle r="220" stroke-width="1" stroke-opacity="0.15"/>
    <circle r="160" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="2 5"/>
    <circle r="100" stroke-width="2.5" stroke-opacity="0.7"/>
  </g>
  <g transform="translate(1200 250)" fill="url(#twOrbit)">
    <circle r="36"/>
    <path d="M-10 0 L-3 7 L12 -8" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark + tagline left -->
  <g font-family="Inter, system-ui, sans-serif" transform="translate(80 130)">
    <g>
      <g transform="translate(0 0)">
        <circle cx="28" cy="28" r="26" fill="none" stroke="url(#twOrbit)" stroke-width="2" stroke-opacity="0.55"/>
        <circle cx="28" cy="28" r="18" fill="none" stroke="url(#twOrbit)" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="2 3"/>
        <circle cx="28" cy="28" r="10" fill="none" stroke="url(#twOrbit)" stroke-width="2"/>
        <circle cx="28" cy="28" r="5" fill="url(#twOrbit)"/>
      </g>
      <text x="72" y="36" fill="#F8FAFC" font-size="28" font-weight="700" letter-spacing="-0.02em">ORBIS<tspan fill="url(#twOrbit)">.ID</tspan></text>
    </g>
    <text y="130" fill="#F8FAFC" font-size="56" font-weight="800" letter-spacing="-0.02em">Your identity.</text>
    <text y="190" fill="#F8FAFC" font-size="56" font-weight="800" letter-spacing="-0.02em">Yours alone.</text>
    <text y="240" fill="#94A3B8" font-size="20">Member-owned self-sovereign identity · orbis.id</text>
  </g>
</svg>
