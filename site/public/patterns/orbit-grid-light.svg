<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="xMidYMid slice" role="presentation">
  <defs>
    <radialGradient id="haloL" cx="0.5" cy="0.0" r="0.7">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#22D3EE" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.3"/>
    </linearGradient>
    <pattern id="dotgridL" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#4F46E5" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#FFFFFF"/>
  <rect width="800" height="600" fill="url(#haloL)"/>
  <rect width="800" height="600" fill="url(#dotgridL)"/>

  <g transform="translate(400 260)" fill="none" stroke="url(#ringL)">
    <circle r="360" stroke-width="1" stroke-opacity="0.12"/>
    <circle r="280" stroke-width="1" stroke-opacity="0.18"/>
    <circle r="200" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="2 6"/>
    <circle r="130" stroke-width="2" stroke-opacity="0.45"/>
    <circle r="70" stroke-width="2.5" stroke-opacity="0.7"/>
  </g>

  <g fill="#22D3EE">
    <circle cx="60" cy="180" r="3"/>
    <circle cx="760" cy="120" r="3"/>
    <circle cx="700" cy="500" r="2.5"/>
    <circle cx="100" cy="500" r="2.5"/>
  </g>
  <g fill="#6366F1">
    <circle cx="200" cy="100" r="2"/>
    <circle cx="600" cy="540" r="2"/>
    <circle cx="120" cy="380" r="2"/>
    <circle cx="680" cy="280" r="2"/>
  </g>

  <g stroke="#4F46E5" stroke-opacity="0.15" stroke-width="1">
    <line x1="100" y1="500" x2="400" y2="260"/>
    <line x1="700" y1="500" x2="400" y2="260"/>
    <line x1="200" y1="100" x2="400" y2="260"/>
    <line x1="600" y1="540" x2="400" y2="260"/>
