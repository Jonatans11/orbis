<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="ORBIS.ID mark">
  <title>ORBIS.ID mark</title>
  <defs>
    <linearGradient id="orbisGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="55%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="orbisGradDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <radialGradient id="orbisCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#E0E7FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer orbit ring -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#orbisGrad)" stroke-width="3" stroke-opacity="0.35"/>
  <!-- Mid orbit ring (slightly tilted look via dash) -->
  <circle cx="60" cy="60" r="40" fill="none" stroke="url(#orbisGrad)" stroke-width="2.5" stroke-opacity="0.55" stroke-dasharray="2 4"/>
  <!-- Inner ring -->
  <circle cx="60" cy="60" r="28" fill="none" stroke="url(#orbisGrad)" stroke-width="2.5"/>

  <!-- Node orbit points -->
  <circle cx="112" cy="60" r="3.2" fill="#22D3EE"/>
  <circle cx="20" cy="60" r="2.6" fill="#6366F1"/>
  <circle cx="60" cy="8" r="2.2" fill="#818CF8"/>

  <!-- Core identity node -->
  <circle cx="60" cy="60" r="14" fill="url(#orbisGrad)"/>
  <circle cx="60" cy="60" r="14" fill="url(#orbisCore)"/>
  <!-- Inner check / identity mark -->
  <path d="M52 60.5 L58 66.5 L68.5 55.5" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
