<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" role="img" aria-label="ORBIS.ID">
  <title>ORBIS.ID wordmark</title>
  <defs>
    <linearGradient id="wmGrad" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="60%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- Mark -->
  <g transform="translate(8 8)">
    <circle cx="52" cy="52" r="50" fill="none" stroke="url(#wmGrad)" stroke-width="2.5" stroke-opacity="0.4"/>
    <circle cx="52" cy="52" r="38" fill="none" stroke="url(#wmGrad)" stroke-width="2" stroke-opacity="0.65" stroke-dasharray="2 3.5"/>
    <circle cx="52" cy="52" r="26" fill="none" stroke="url(#wmGrad)" stroke-width="2.5"/>
    <circle cx="52" cy="52" r="13" fill="url(#wmGrad)"/>
    <path d="M44 52.5 L50 58.5 L60.5 47.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="102" cy="52" r="2.6" fill="#22D3EE"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, 'SF Pro Display', system-ui, -apple-system, sans-serif" font-weight="700" letter-spacing="-0.02em">
    <text x="140" y="74" font-size="44" fill="#0F172A">ORBIS</text>
    <text x="328" y="74" font-size="44" fill="url(#wmGrad)">.ID</text>
  </g>
</svg>
