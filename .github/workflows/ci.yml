# ─── ORBIS.ID CI Pipeline ───────────────────────────────────────
# Runs on every push to any branch and every pull request.
# Installs dependencies, type-checks, and runs tests.

name: CI

on:
  push:
    branches: ["main", "feat/*", "fix/*", "chore/*"]
  pull_request:
    branches: ["main"]

env:
  NODE_ENV: test

jobs:
  test:
    name: "Build & Test (Bun)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            bun-

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run build

      - name: Run tests
        run: bun run test
        env:
          TEAM_DB_SYNC_URL: ${{ secrets.TEAM_DB_SYNC_URL || '' }}

  docker-build:
    name: "Docker Image Build"
    runs-on: ubuntu-latest
    # Only run on pushes (not PRs) to reduce CI time
    if: github.event_name == 'push'
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: orbis-ssi-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max