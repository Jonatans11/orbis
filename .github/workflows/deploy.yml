# ─── ORBIS.ID Deploy Pipeline ───────────────────────────────────
# Placeholder deploy workflow. Triggers on merge to main.
# Extend with actual deployment steps (Docker push, cloud deploy, etc.)

name: Deploy

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: orbis-ssi-backend

jobs:
  deploy:
    name: "Build & Publish Docker Image"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Placeholder: Extend with cloud deployment steps ─────
      # Example: Deploy to Railway / Fly.io / Kubernetes:
      # - name: Deploy to Railway
      #   run: railway up
      #   env:
      #     RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      # ──────────────────────────────────────────────────────────
      - name: Deployment notification
        run: |
          echo "::notice::Docker image built and published: ${{ steps.meta.outputs.tags }}"
          echo "::notice::Deployment target not configured — extend this workflow for your cloud provider."